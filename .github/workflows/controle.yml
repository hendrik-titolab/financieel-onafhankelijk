# Verplichte controle vóór een deploy.
#
# Er was geen enkele workflow in deze repo. De build slaagde terwijl `tsc --noEmit`
# faalde op een ontbrekende typedeclaratie, en niets dwong af dat de tests draaiden
# voordat er naar productie werd gepusht (audit 7 september 2026, bevinding 24).
#
# Vercel bouwt uit deze repo en deployt automatisch bij een push naar
# astro-migratie. Deze workflow draait daar naast: hij houdt een kapotte push niet
# tegen, maar maakt hem wel meteen zichtbaar. Wie dit hard wil maken, zet
# branch protection op astro-migratie met deze workflow als verplichte check.
name: Controle

on:
  push:
    branches: [astro-migratie, main]
  pull_request:
  workflow_dispatch:

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      # v4 van beide actions hieronder draaide zelf nog op Node 20, dat GitHub
      # aan het uitfaseren is ("forced to run on Node.js 24", gezien in de runlog
      # van 16 september 2026). Opgehoogd naar de laatste major (v7 voor allebei,
      # nagekeken via de GitHub releases van deze twee actions), geen
      # gedragswijziging voor deze eenvoudige aanroepen (alleen fetch-depth en
      # node-version/cache).
      - uses: actions/checkout@v7
        with:
          # Volledige geschiedenis nodig voor de versiecheck hieronder, die de PR
          # vergelijkt met de basisbranch (git diff met '...' vereist een gedeelde
          # voorouder, die een ondiepe clone niet heeft).
          #
          # Was eerder conditioneel (alleen 0 op een pull_request, anders de
          # standaard ondiepe clone) als kleine efficiencywinst. Teruggedraaid: de
          # GitHub Actions-expressie `cond && 0 || 1` gaf altijd 1, ook op een PR,
          # want Actions behandelt 0 als "falsy" — dus de rechterkant van `||`
          # won altijd, ongeacht `cond`. Dat brak de versiecheck op de eerste
          # echte PR-run (bevinding 14 september 2026: eerst "unknown revision",
          # daarna "no merge base"). Een kleine checkout-optimalisatie is de
          # complexiteit en het risico van deze klasse fout niet waard.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # Vastgelegd in plaats van "latest": een Node-wissel mag een rekenuitkomst
          # nooit stilzwijgend veranderen.
          # Was '20', gelijk aan de engines-eis in package.json (>=18.20.8). Die eis
          # bleek zelf achterhaald: Astro 7.2.0 (sinds 10 augustus 2026 in gebruik)
          # vereist Node >=22.12.0 en weigert te draaien op 20. Dat kwam pas nu aan
          # het licht, omdat de workflow altijd al eerder vastliep (zie hierboven).
          # package.json's engines-veld is nog niet bijgewerkt, zie het slotbericht.
          node-version: '22'
          cache: npm

      - name: Afhankelijkheden installeren
        run: npm ci

      - name: Astro-types genereren
        # tsc heeft de door Astro gegenereerde types nodig (astro:content).
        # Zonder deze stap faalde de typecontrole in CI op elke run.
        run: npx astro sync

      - name: Typecontrole
        # Los van de build. Astro's build compileert met esbuild en meldt
        # typefouten niet; dit is de enige stap die dat wel doet.
        run: npx tsc --noEmit

      - name: Astro-controle
        run: npm run check

      - name: Versiecheck
        # Alleen zinvol op een PR: vergelijkt met de basisbranch. Zie
        # scripts/check-modelversie.mjs voor de reden.
        if: github.event_name == 'pull_request'
        run: node scripts/check-modelversie.mjs

      - name: Tests
        # Bevat de golden masters, de fiscale referentiegevallen en de
        # grensgevallen uit de audit van september 2026.
        run: npm test

      - name: Productiebuild
        run: npm run build

      - name: Kwetsbaarheden melden
        # Niet blokkerend: een nieuwe melding in een transitieve afhankelijkheid
        # mag een correctie aan de rekenkern niet tegenhouden. Wel zichtbaar in het
        # log, zodat het een besluit is en geen verrassing.
        run: npm audit --audit-level=high || true
